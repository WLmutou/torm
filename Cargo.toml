[package]
name = "torm"
version = "0.2.0"
edition = "2021"

[dependencies]
tokio = { version = "1.53", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
thiserror = "1.0"
