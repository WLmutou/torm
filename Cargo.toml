[workspace]
members = [".", "torm-derive"]

[package]
name = "torm"
version = "0.3.0"
edition = "2021"
rust-version = "1.70"
description = "A Tokio-based async ORM for Rust with GORM-like API, supporting SQLite, MySQL and PostgreSQL via native wire protocols"
license = "MIT"
authors = ["WLmutou <jun1484528313@163.com>"]
repository = "https://github.com/WLmutou/torm"
homepage = "https://github.com/WLmutou/torm"
documentation = "https://docs.rs/torm"
readme = "README.md"
keywords = ["orm", "database", "tokio", "sqlite", "mysql"]
categories = ["database-implementations", "asynchronous"]

[dependencies]
torm-derive = { path = "torm-derive", version = "0.1.0" }
tokio = { version = "1.53", features = ["full"] }
rusqlite = { version = "0.30", features = ["bundled"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
thiserror = "1.0"
# PostgreSQL / MySQL wire protocol authentication
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
# RSA encryption for caching_sha2_password full auth (MySQL 8.0+)
rsa = "0.9"
num-bigint = "0.4"
rand = "0.8"
