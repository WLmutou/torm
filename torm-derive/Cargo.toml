[package]
name = "torm-derive"
version = "0.2.0"
edition = "2021"
rust-version = "1.70"
description = "Derive macros for the TORM library (Tokio ORM)"
license = "MIT"
authors = ["WLmutou <jun1484528313@163.com>"]
repository = "https://github.com/WLmutou/torm"
homepage = "https://github.com/WLmutou/torm"
documentation = "https://docs.rs/torm-derive"
readme = "../README.md"
keywords = ["orm", "derive", "proc-macro", "torm", "database"]
categories = ["database-implementations", "rust-patterns"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }

[dev-dependencies]
